<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.idle { cursor: none; }
  div.marpit { height: 100%; }
  /* One slide at a time; the SVG viewBox letterboxes it into any window. */
  div.marpit > svg[data-marpit-svg] { display: none; }
  div.marpit > svg[data-marpit-svg].is-active { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="deck"></div>

<script type="module">
// The deck window's runtime: show one slide, move between them, and stay in
// step with the presenter console. Nothing is drawn on top of the slide — no
// control bar, no page counter, no cursor once you stop moving it.

import { createSync } from '/sync.js';

const params = new URLSearchParams(location.search);

// Previews inside the console are mirrors: no keys, no channel, no cursor
// handling. The console positions them by calling `deck.go()` directly.
const isPreview = params.has('preview');

// The deck is identified by this page's own URL, so its slides, its stylesheet
// and its assets all live under the same path.
const deckPath = location.pathname.replace(/^\/decks\//, '');
document.title = decodeURIComponent(deckPath.split('/').pop()).replace(/\.md$/, '');

let slides = [];
let index = Number(params.get('slide')) || 1;

// Until the slides arrive there is no count to clamp against, so a `go()` that
// lands early keeps its number and is bounded by the `show()` after the load.
const clamp = (n) => {
  const wanted = Math.max(Math.round(n) || 1, 1);
  return slides.length ? Math.min(wanted, slides.length) : wanted;
};

function show(next) {
  index = clamp(next);
  // Before the slides arrive this only records where to land.
  slides.forEach((slide, i) => slide.classList.toggle('is-active', i === index - 1));

  if (isPreview || slides.length === 0) return;
  // replaceState on a copy of the current URL: a reload keeps the slide, the
  // sync id and everything else, without one history entry per slide.
  const url = new URL(location.href);
  url.searchParams.set('slide', index);
  history.replaceState(null, '', url);
}

// Same-origin handle for the console's preview iframes. It exists before the
// slides load, so a `go()` that arrives early is honoured once they do.
window.deck = {
  go: show,
  get current() {
    return index;
  },
  get count() {
    return slides.length;
  },
};

await load();
show(index);

if (!isPreview) present();

/** Fetch this deck's stylesheet and slides, and put them in the page. */
async function load() {
  const stylesheet = Object.assign(document.createElement('link'), {
    rel: 'stylesheet',
    href: `/api/style/${deckPath}`,
  });

  const styled = new Promise((done) => stylesheet.addEventListener('load', done, { once: true }));
  document.head.append(stylesheet);

  const response = await fetch(`/api/slides/${deckPath}`);
  if (!response.ok) throw new Error(`${deckPath}: slides could not be rendered (HTTP ${response.status})`);

  const container = document.getElementById('deck');
  container.innerHTML = await response.text();

  // Marp inlines its browser helper — auto-scaling and the Safari SVG polyfill
  // — with the slides, and a script inserted via innerHTML never runs. Swap in
  // fresh script elements so it does, now that the slides are in the DOM.
  for (const inert of container.querySelectorAll('script')) {
    const script = document.createElement('script');
    script.textContent = inert.textContent;
    inert.replaceWith(script);
  }

  slides = [...container.querySelectorAll('div.marpit > svg[data-marpit-svg]')];
  await styled; // paint styled slides, never a flash of unstyled ones
}

/** Everything only the projected window does: keys, sync, and the cursor. */
function present() {
  const sync = createSync(params.get('sync'), {
    getSlide: () => index,
    // The console moved us — `show`, not `goto`, so the move is not announced
    // straight back to the console it came from.
    onSlide: show,
  });

  /** Move, and tell the console where we went. */
  function goto(next) {
    const before = index;
    show(next);
    if (index !== before) sync.announce(index);
  }

  const KEYS = {
    ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1, Enter: 1,
    ArrowLeft: -1, ArrowUp: -1, PageUp: -1, Backspace: -1,
  };

  document.addEventListener('keydown', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;

    if (event.key === 'Home') goto(1);
    else if (event.key === 'End') goto(slides.length);
    else if (event.key === 'f')
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    else if (KEYS[event.key]) goto(index + KEYS[event.key]);
    else return;

    event.preventDefault();
  });

  // A pointer parked over the projected image is a distraction.
  let idleTimer;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  };
  document.addEventListener('mousemove', wake);
  wake();
}
</script>
</body>
</html>
